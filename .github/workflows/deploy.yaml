name: gh-pages publisher 🚀

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-gh-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      # - run: pwd && ls -al
      # - run: sed -i -E 's#href="/([a-z])#href="/regexper-ng/\1#g' lib/partials/page_top.handlebars
      # - run: sed -i -E 's#a href="/"#a href="/regexper-ng/"#g' lib/partials/page_top.handlebars
      # - run: cat lib/partials/page_top.handlebars
      - run: npm install
      - run: npx webpack
        env:
          NODE_ENV: production
          DIST_URL: /regexper-ng
      - name: Deploy to GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cp -a build "$RUNNER_TEMP/build"

          git checkout --orphan gh-pages
          git reset --hard
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +

          cp -a "$RUNNER_TEMP/build/." .
          git add -A
          git diff --staged --quiet || git commit -m "chore: deploy to GitHub Pages [skip ci]"
          git push -f origin gh-pages

name: Releases 📦

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - run: make pack_extensions
      - uses: ncipollo/release-action@v1
        with:
          artifacts: 'regexper-ng*.vsix'
          token: ${{ secrets.AUTOMATION_SECRET }}
